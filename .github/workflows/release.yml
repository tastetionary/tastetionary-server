name: build_and_push

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v2
        with:
          node-version: '18.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@homekeeper89'
      - run: npm ci
      - run: npm i -g rimraf
      - run: npm run package:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Bump to new version
        run: |
          TAG=$(git tag --sort=version:refname | tail -n 1)
          git config user.name "taste-bot"
          git config user.email "noreply@github.com"
          git switch -c bump-$TAG
          npx nestia swagger
          npm version $TAG -m "bump to $TAG"
          cd packages/api
          npm version $TAG -m "bump to $TAG"
          git diff-index --quiet HEAD || git commit -am "bump to $TAG"
          git push --set-upstream origin bump-$TAG
          gh pr create --title "bump to $TAG" --body "bump to $TAG" --base develop --head bump-$TAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: inject env
        run: |
          echo "ENV=dev" > .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "API_SERVER_PORT=${{ secrets.API_SERVER_PORT }}"" >> .env
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCACCESS_TOKEN_SECRET }}" >> .env
          echo "ACCESS_TOKEN_EXPIRED_AT=${{ secrets.ACCESS_TOKEN_EXPIRED_AT }}" >> .env
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}" >> .env
          echo "REFRESH_TOKEN_EXPIRED_AT=${{ secrets.REFRESH_TOKEN_EXPIRED_AT }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to NCP registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.dev
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/taste-server:latest
            ${{ secrets.DOCKER_REGISTRY }}/taste-server:${{ github.REF_NAME }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/taste-server:latest
          cache-to: type=inline
