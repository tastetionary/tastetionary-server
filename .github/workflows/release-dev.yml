name: build_and_push_dev

on:
  release:
    types: [published]
  push:
    branches:
      - testing
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up database resource
        env:
          POSTGRES_PASSWORD: postgres
          HOST: localhost
          POSTGRES_USER: postgres
          PORT: 5433
        run: |
          cd docker
          docker compose up -d
          until PGPASSWORD=$POSTGRES_PASSWORD psql -h $HOST -p $PORT -U $POSTGRES_USER -c '\q'; do
            >&2 echo "Postgres is unavailable - sleeping"
            sleep 1
          done
          cd ..

      - name: Change Env variables
        run: |
          echo DATABASE_URL=\"postgresql://postgres:postgres@localhost:5433/taste\" > .env

      - name: Install dependencies
        run: |
          npm install
      - name: Run tests
        run: |
          cp .env.sample .env
          npx prisma migrate deploy
          npx prisma generate
          npm run test:seq

  publish:
    runs-on: ubuntu-latest
    if: success() && github.event.action == 'published'
    needs: [ test ]
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v2
        with:
          node-version: '18.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@homekeeper89'
      - run: npm ci
      - run: npm i -g rimraf

      - name: Bump to new version
        run: |
          TAG=$(git tag --sort=version:refname | tail -n 1)
          git config user.name "taste-bot"
          git config user.email "noreply@github.com"
          git switch -c bump-$TAG

      - name: Publish packages
        run: |
          TAG=$(git tag --sort=version:refname | tail -n 1)
          npm version $TAG -m "bump to $TAG"
          cd packages/api
          npm version $TAG -m "bump to $TAG"
          cd ../../
          npx nestia swagger
          npm run package:publish
          git diff-index --quiet HEAD || git add -A && git commit -m "bump to $TAG"
          git push --set-upstream origin bump-$TAG
          gh pr create --title "bump to $TAG" --body "bump to $TAG" --base develop --head bump-$TAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  build_and_push:
    if: success() && github.event.action == 'published'
    needs: [ publish ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: inject env
        run: |
          echo "ENV=dev" > .env
          echo "API_SERVER_URL=${{ secrets.API_SERVER_DEV_URL }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_DEV_URL }}" >> .env
          echo "API_SERVER_PORT=${{ secrets.API_SERVER_DEV_PORT }}" >> .env
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_DEV_SECRET }}" >> .env
          echo "ACCESS_TOKEN_EXPIRED_AT=${{ secrets.ACCESS_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_DEV_SECRET }}" >> .env
          echo "REFRESH_TOKEN_EXPIRED_AT=${{ secrets.REFRESH_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to NCP registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/taste-server:latest
            ${{ secrets.DOCKER_REGISTRY }}/taste-server:${{ github.REF_NAME }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/taste-server:latest
          cache-to: type=inline

  build_and_push_test:
    if: success() && github.ref == 'refs/heads/testing' && github.event_name == 'push'
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: inject env
        run: |
          echo "ENV=dev" > .env
          echo "API_SERVER_URL=${{ secrets.API_SERVER_DEV_URL }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_DEV_URL }}" >> .env
          echo "API_SERVER_PORT=${{ secrets.API_SERVER_DEV_PORT }}" >> .env
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_DEV_SECRET }}" >> .env
          echo "ACCESS_TOKEN_EXPIRED_AT=${{ secrets.ACCESS_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_DEV_SECRET }}" >> .env
          echo "REFRESH_TOKEN_EXPIRED_AT=${{ secrets.REFRESH_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          REPOSITORY: taste-server
          IMAGE_TAG: latest
        run: |
          docker build -f docker/Dockerfile -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    runs-on: self-hosted
    if: always()
    needs: [ build_and_push_test, build_and_push ]
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: SSH and run docker container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            ./init.sh