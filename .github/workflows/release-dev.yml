name: build_and_push_dev

on:
  release:
    types: [published]
  push:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up database resource
        env:
          POSTGRES_PASSWORD: postgres
          HOST: localhost
          POSTGRES_USER: postgres
          PORT: 5433
        run: |
          cd docker
          docker-compose up -d
          until PGPASSWORD=$POSTGRES_PASSWORD psql -h $HOST -p $PORT -U $POSTGRES_USER -c '\q'; do
            >&2 echo "Postgres is unavailable - sleeping"
            sleep 1
          done
          cd ..

      - name: Change Env variables
        run: |
          echo DATABASE_URL=\"postgresql://postgres:postgres@localhost:5433/taste\" > .env

      - name: Install dependencies
        run: |
          npm install
      - name: Run tests
        run: |
          cp .env.sample .env
          npx prisma migrate deploy
          npx prisma generate
          npm run test

  publish:
    runs-on: ubuntu-latest
    if: success() && github.event.action == 'published'
    needs: [ test ]
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v2
        with:
          node-version: '18.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@homekeeper89'
      - run: npm ci
      - run: npm i -g rimraf

      - name: Bump to new version
        run: |
          TAG=$(git tag --sort=version:refname | tail -n 1)
          git config user.name "taste-bot"
          git config user.email "noreply@github.com"
          git switch -c bump-$TAG

      - name: Publish packages
        run: |
          TAG=$(git tag --sort=version:refname | tail -n 1)
          npm version $TAG -m "bump to $TAG"
          cd packages/api
          npm version $TAG -m "bump to $TAG"
          cd ../../
          npx nestia swagger
          npm run package:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

  build_and_push:
    if: success() && github.event.action == 'published'
    needs: [ publish ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: inject env
        run: |
          echo "ENV=dev" > .env
          echo "API_SERVER_URL=${{ secrets.API_SERVER_DEV_URL }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_DEV_URL }}" >> .env
          echo "API_SERVER_PORT=${{ secrets.API_SERVER_DEV_PORT }}" >> .env
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_DEV_SECRET }}" >> .env
          echo "ACCESS_TOKEN_EXPIRED_AT=${{ secrets.ACCESS_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_DEV_SECRET }}" >> .env
          echo "REFRESH_TOKEN_EXPIRED_AT=${{ secrets.REFRESH_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to NCP registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/taste-server:latest
            ${{ secrets.DOCKER_REGISTRY }}/taste-server:${{ github.REF_NAME }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/taste-server:latest
          cache-to: type=inline

  build_and_push_test:
    if: success() && github.ref == 'refs/heads/test' && github.event_name == 'push'
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: inject env
        run: |
          echo "ENV=dev" > .env
          echo "API_SERVER_URL=${{ secrets.API_SERVER_DEV_URL }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_DEV_URL }}" >> .env
          echo "API_SERVER_PORT=${{ secrets.API_SERVER_DEV_PORT }}" >> .env
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_DEV_SECRET }}" >> .env
          echo "ACCESS_TOKEN_EXPIRED_AT=${{ secrets.ACCESS_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_DEV_SECRET }}" >> .env
          echo "REFRESH_TOKEN_EXPIRED_AT=${{ secrets.REFRESH_TOKEN_DEV_EXPIRED_AT }}" >> .env
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to NCP registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/taste-test-server:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/taste-test-server:latest
          cache-to: type=inline

  deploy_test:
    runs-on: self-hosted
    if: success() && github.ref == 'refs/heads/test' && github.event_name == 'push'
    needs: [ build_and_push_test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: SSH and run docker container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker stop $(docker ps -a -q)
            docker stop taste-test-server
            docker rm -f taste-test-server
            docker run -d --name taste-test-server -p 8080:8080 ${{ secrets.DOCKER_REGISTRY }}/taste-test-server:latest